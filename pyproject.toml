[project]
name = "reposcale"
version = "0.1.0"
description = "Controlled evaluation harness for coding-agent repository understanding."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
reposcale = "reposcale.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reposcale"]
