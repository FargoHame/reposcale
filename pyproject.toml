[project]
name = "reposcale"
version = "0.1.0"
description = "Controlled evaluation harness for coding-agent repository understanding."
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.12",
    "langchain-mistralai>=1.0.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
reposcale = "reposcale.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reposcale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
